<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Dashboard</title>

    <style>
        body {
            background-color: #f4f4f4;
        }

        /* Sidebar */
        .sidebar {
            height: 100vh;
            background-color: #212529;
            color: white;
            padding-top: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 10px;
        }

        .sidebar a:hover {
            background-color: gray;
        }

        /* Cards */
        .card {
            box-shadow: 0px 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>

<body>

    <div class="container-fluid">

        <div class="row">

            <!-- Sidebar -->
            <div class="col-md-2 sidebar">

                <h3 class="text-center">Admin</h3>

                <a href="#">Dashboard</a>
                <a href="#">Students</a>
                <a href="#">Exams</a>
                <a href="#">Results</a>
                <a href="#">Settings</a>

            </div>

            <!-- Main Content -->
            <div class="col-md-10 p-4">

                <h2>College Dashboard</h2>

                <div class="row mt-4">

                    <!-- Card 1 -->
                    <div class="col-md-3">
                        <div class="card text-center p-3">
                            <h5>Total Students</h5>
                            <h2>1200</h2>
                        </div>
                    </div>

                    <!-- Card 2 -->
                    <div class="col-md-3">
                        <div class="card text-center p-3">
                            <h5>Total Exams</h5>
                            <h2>15</h2>
                        </div>
                    </div>

                    <!-- Card 3 -->
                    <div class="col-md-3">
                        <div class="card text-center p-3">
                            <h5>Passed</h5>
                            <h2>1000</h2>
                        </div>
                    </div>

                    <!-- Card 4 -->
                    <div class="col-md-3">
                        <div class="card text-center p-3">
                            <h5>Failed</h5>
                            <h2>200</h2>
                        </div>
                    </div>

                </div>
                  <!-- Recent Data Table -->
<div class="card mt-4 shadow-sm">

    <div class="card-header bg-dark text-white">
        Recent Students
    </div>

    <div class="card-body">

        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>101</td>
                        <td>Sarthak</td>
                        <td>IT Engineering</td>
                        <td>Active</td>
                    </tr>

                    <tr>
                        <td>102</td>
                        <td>Rahul</td>
                        <td>Computer Engineering</td>
                        <td>Active</td>
                    </tr>

                    <tr>
                        <td>103</td>
                        <td>Priya</td>
                        <td>ENTC</td>
                        <td>Inactive</td>
                    </tr>

                    <tr>
                        <td>104</td>
                        <td>Amit</td>
                        <td>Mechanical</td>
                        <td>Active</td>
                    </tr>
                </tbody>

            </table>

        </div>

    </div>

</div>

            </div>

        </div>

      
    </div>

</body>

</html>
